<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trazabilidad de pedidos · Order Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="/vendor/xlsx.full.min.js"></script>
<script>window.XLSX || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>');</script>
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#17212C; --muted:#5B6775; --line:#D5DBE2;
  --steel:#2D5B85; --steel-ink:#FFFFFF; --amber:#A86C12; --amber-bg:#FBF1DF; --green:#2E7A4E; --green-bg:#E3F2E9;
  --red:#B23B2E; --red-bg:#F8E4E1; --track:#DDE3E9; --sched:#6E97BF;
  --f-body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --f-num:"Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121820; --surface:#1B232D; --sunk:#161D26; --ink:#E6EBF0; --muted:#9AA6B3; --line:#2C3743;
    --steel:#6FA3D6; --steel-ink:#0E1620; --amber:#E0A54A; --amber-bg:#3A2D17; --green:#5DB585; --green-bg:#193226;
    --red:#E2705F; --red-bg:#3B1F1B; --track:#2A3441; --sched:#48698B;
  }
}
:root[data-theme="dark"]{
  --bg:#121820; --surface:#1B232D; --sunk:#161D26; --ink:#E6EBF0; --muted:#9AA6B3; --line:#2C3743;
  --steel:#6FA3D6; --steel-ink:#0E1620; --amber:#E0A54A; --amber-bg:#3A2D17; --green:#5DB585; --green-bg:#193226;
  --red:#E2705F; --red-bg:#3B1F1B; --track:#2A3441; --sched:#48698B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
header.top{display:flex;align-items:center;gap:24px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--f-num);font-weight:700;font-size:22px;letter-spacing:.2px;white-space:nowrap}
.brand span{color:var(--muted);font-weight:500}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--surface)}
nav.tabs button .count{font-family:var(--f-num);margin-left:4px}
.sync{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green)} .dot.warn{background:var(--amber)} .dot.err{background:var(--red)}

main{padding:20px;max-width:1500px;margin:0 auto}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.btn.danger{color:var(--red)}
.btn.ghost{border-color:transparent;background:none}
.btn.small{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:140px;font-family:var(--f-num);font-size:15px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f > *{color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}

/* layout */
.layout{display:grid;grid-template-columns:minmax(330px,430px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:1fr}}
.layout > section{min-width:0}
html,body{overflow-x:hidden}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel-b{padding:16px}
h2{font-family:var(--f-num);font-weight:600;font-size:20px;margin:0}
h3{font-family:var(--f-num);font-weight:600;font-size:17px;margin:0}

/* pedido list */
.plist{list-style:none;margin:0;padding:0;max-height:calc(100vh - 210px);overflow:auto}
.plist li{border-bottom:1px solid var(--line)}
.plist button{all:unset;display:block;width:100%;box-sizing:border-box;padding:12px 16px;cursor:pointer}
.plist button:hover{background:var(--sunk)}
.plist button[aria-current="true"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--steel)}
.plist .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.plist .ped{font-family:var(--f-num);font-weight:600;font-size:18px}
.plist .l2{font-size:13px;color:var(--muted);margin:2px 0 8px}

/* stacked bar */
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--track)}
.bar.big{height:14px}
.bar i{display:block;height:100%}
.s-ent{background:var(--green)} .s-age{background:var(--sched)} .s-sin{background:var(--amber)} .s-pen{background:var(--track)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.legend b{font-family:var(--f-num);font-size:22px;font-weight:600;display:block;color:var(--ink);line-height:1.1}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:baseline}

/* detail */
.dhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.dtitle{font-family:var(--f-num);font-size:32px;font-weight:700;line-height:1}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 0;padding:0 16px}
.subtabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* entrega card */
.ent{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;background:var(--surface)}
.ent.anulada{opacity:.55}
.ent .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ent .id{font-family:var(--f-num);font-weight:600;font-size:19px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.tag.amber{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.tag.green{background:var(--green-bg);border-color:transparent;color:var(--green)}
.tag.red{background:var(--red-bg);border-color:transparent;color:var(--red)}

/* the step track: the one bold element */
.track{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));margin:14px 0 6px;position:relative}
.track::before{content:"";position:absolute;left:5.5%;right:5.5%;top:13px;height:2px;background:var(--track)}
.stp{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;position:relative;padding:0 2px}
.stp .k{width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--track);display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:14px;color:var(--muted)}
.stp .t{font-size:11.5px;line-height:1.15;text-align:center;color:var(--muted)}
.stp.done .k{background:var(--green);border-color:var(--green);color:var(--surface)}
.stp.done .t{color:var(--ink)}
.stp.next .k{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 4px var(--amber-bg)}
.stp.next .t{color:var(--amber);font-weight:600}
.stp:focus-visible .k{outline:2px solid var(--steel);outline-offset:2px}
.stp:hover .k{border-color:var(--ink)}
.stp.done:hover .k{border-color:var(--ink)}
@media (max-width:620px){.stp .t{display:none}.track::before{top:13px}}
.ent .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px}
table.t tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.warn-t{color:var(--red);font-weight:600}

/* inbox */
.inbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.col h3{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.col h3 .num{font-size:22px;color:var(--amber)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.card .c1{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.card .c1 b{font-family:var(--f-num);font-size:17px;font-weight:600}
.card .c2{font-size:13px;color:var(--muted);margin:2px 0 8px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(10,16,24,.45)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg-b{padding:18px 20px;overflow:auto;max-height:calc(92vh - 130px)}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.err{color:var(--red);font-size:13px;min-height:18px}
input.qty{width:90px;text-align:right}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.log{font-size:12.5px;color:var(--muted);margin:8px 0 0;padding-left:16px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:8px}

/* Avisos fijos: resultados de SAP y del cubicaje que no deben perderse */
.avisos{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.aviso{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;
  background:var(--card);padding:10px 12px}
.aviso.error{border-left-color:var(--err)}
.aviso.info{border-left-color:var(--accent)}

/* Pantallas chicas: una columna, tablas que se deslizan y visor más bajo */
@media (max-width: 900px){
  header{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .tabs{order:3;width:100%;overflow-x:auto;white-space:nowrap}
  .sync{margin-left:auto;font-size:12px}
  main{padding:12px}
  .layout{grid-template-columns:1fr !important}
  .grid-form{grid-template-columns:1fr !important}
  .legend{flex-wrap:wrap;gap:10px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.t{min-width:560px}
  iframe{height:380px !important}
  .ent .top{flex-direction:column;align-items:flex-start;gap:4px}
  .row{flex-wrap:wrap}
  dialog{width:calc(100vw - 24px);max-width:none}
}

/* Ítems de la carga en el cubicador: una fila por producto, como una lista de carga */
.items{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);padding:6px 8px}
.item .letra{width:26px;height:26px;border-radius:6px;color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.item .letra.vacia{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.item .cuerpo{flex:1;min-width:0}
.item .l1{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.item .l2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mini{display:flex;flex-direction:column;font-size:10px;color:var(--muted);gap:2px;flex:none}
.item .mini input{width:62px}
.item.nuevo{border-style:dashed}
.sugerencias{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:4px;max-height:240px;
  overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sugerencias button{display:block;width:100%;text-align:left;padding:7px 10px;background:none;
  border:0;border-bottom:1px solid var(--line);cursor:pointer}
.sugerencias button:hover{background:var(--bg)}

/* Cubicador: un solo cuadro con la carga a la izquierda y el camión a la derecha */
.panel.cubicador .panel-h{align-items:center;gap:18px;flex-wrap:wrap}
.cifras{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
.cifras .dato{display:flex;flex-direction:column;line-height:1.15}
.cifras .dato span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.cifras .dato b{font-size:19px}
.cifras .dato b.chico{font-size:13px;font-weight:600}
.cub-cuerpo{display:grid;grid-template-columns:minmax(330px,400px) minmax(0,1fr);gap:18px;align-items:start}
.cub-col{min-width:0;display:flex;flex-direction:column;gap:14px}
.cub-bloque{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.cub-t{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--ink);margin-bottom:9px;display:flex;justify-content:space-between;gap:8px}
.cub-t .muted{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
.cub-bloque .grid-form{gap:9px}
.row.chicos{margin-top:9px;gap:6px;flex-wrap:wrap}
.items{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;padding-right:2px}
.item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);padding:6px 8px}
.item .letra{width:26px;height:26px;border-radius:6px;color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.item .letra.vacia{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.item .cuerpo{flex:1;min-width:0}
.item .l1{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.item .l2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mini{display:flex;flex-direction:column;font-size:10px;color:var(--muted);gap:2px;flex:none;align-items:center}
.item .mini input{width:58px;text-align:center}
.item.nuevo{border-style:dashed;background:var(--bg)}
.sugerencias{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:4px;max-height:240px;
  overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.14)}
.sugerencias button{display:block;width:100%;text-align:left;padding:7px 10px;background:none;
  border:0;border-bottom:1px solid var(--line);cursor:pointer}
.sugerencias button:hover{background:var(--bg)}
.visor-caja{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.visor-caja iframe{display:block;width:100%;height:min(66vh,640px);border:0}
.visor-caja .abrir{position:absolute;top:8px;right:8px;background:var(--card);opacity:.93}
.camiones{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.camion{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.camion .barra{height:6px;border-radius:99px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.camion .barra span{display:block;height:100%;border-radius:99px}
.camion .meta{display:flex;justify-content:space-between;gap:10px}
@media (max-width: 1000px){
  .cub-cuerpo{grid-template-columns:1fr}
  .visor-caja iframe{height:420px}
  .items{max-height:none}
  .cifras{gap:14px}
  .cifras .dato b{font-size:16px}
}


/* Cubicador: un solo cuadro con las cifras arriba y dos columnas abajo */
.panel.cubicador{display:flex;flex-direction:column;min-height:calc(100vh - 118px)}
.panel.cubicador > .panel-h{align-items:center;gap:24px;flex-wrap:wrap}
.cifras{display:flex;flex-wrap:wrap;gap:22px;margin-left:auto}
.cifras .dato{display:flex;flex-direction:column;min-width:64px}
.cifras .dato span{font-size:10px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
.cifras .dato b{font-size:20px;line-height:1.15}
.cifras .dato b.chico{font-size:13px;font-weight:600}
.cub-cuerpo{display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr);gap:18px;
  flex:1;min-height:0;align-items:stretch}
.cub-col{display:flex;flex-direction:column;min-width:0;gap:10px}
.cub-col.visor{height:100%}
.cub-col.visor .visor-caja{flex:1;min-height:460px}
.cub-col.visor .visor-caja iframe{height:100%;min-height:460px}
@media (max-width: 1100px){
  .cub-cuerpo{grid-template-columns:1fr}
  .cub-col.visor .visor-caja{min-height:400px}
  .cifras{margin-left:0}
}

/* Cubicador en un solo cuadro: cabecera con cifras, carga a la izquierda, visor a la derecha */
.panel.cubicador .panel-h{flex-wrap:wrap;gap:18px;align-items:center}
.cub-cuerpo{display:grid;grid-template-columns:minmax(330px,380px) minmax(0,1fr);gap:0}
.cub-izq{padding:14px 16px;border-right:1px solid var(--line);max-height:74vh;overflow:auto}
.cub-der{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cub-der .visor-caja{flex:1;min-height:420px}
.cub-der .visor-caja iframe{height:100%;min-height:420px}
.camiones{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.camion{flex:0 0 165px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card)}
.camion .num{font-weight:700}
.camion .barra{height:6px;border-radius:99px;background:var(--line);margin:7px 0 5px;overflow:hidden}
.camion .barra span{display:block;height:100%;border-radius:99px}
.camion .meta{display:flex;justify-content:space-between}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width: 1000px){
  .cub-cuerpo{grid-template-columns:1fr}
  .cub-izq{border-right:0;border-bottom:1px solid var(--line);max-height:none}
  .cub-der .visor-caja iframe{height:400px;min-height:0}
}

/* Cabecera del cubicador: las cifras en fila, con aire entre rótulo y número */
.panel.cubicador .panel-h{display:flex;flex-direction:row;align-items:center;flex-wrap:wrap;gap:16px 22px;padding:12px 16px}
.panel.cubicador .panel-h h2{margin:0}
.panel.cubicador .resumen{display:flex;flex-direction:row;flex-wrap:wrap;gap:20px;margin:0}
.panel.cubicador .resumen .dato{display:flex;flex-direction:column;gap:2px;min-width:74px}
.panel.cubicador .resumen .dato span{font-size:11px;color:var(--muted);line-height:1.1}
.panel.cubicador .resumen .dato b{font-size:21px;line-height:1.05}
.panel.cubicador .resumen .dato b.chico{font-size:13px;font-weight:600;padding-top:5px}
.cub-der .visor-caja .abrir{top:auto;bottom:10px;right:10px}
.cub-izq .bloque-t{display:flex;align-items:baseline;gap:8px}

/* Los selectores de la columna izquierda no se cortan */
.cub-izq select, .cub-izq input, .cub-izq .f{max-width:100%;min-width:0}
.opciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cub-cuerpo{grid-template-columns:minmax(340px,390px) minmax(0,1fr)}

/* Opciones del cubicador: una fila por pregunta, botones en vez de listas */
.cub-opts{display:grid;gap:10px;margin:4px 0 14px;padding:12px;background:var(--sunk);border:1px solid var(--line);border-radius:10px}
.cub-opts .op{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px}
.cub-opts .op > span{font-size:12px;color:var(--muted);font-weight:600}
.cub-opts .op select{width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:6px 8px;font:inherit;font-size:13px;cursor:pointer;line-height:1.2}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.cub-opts .ayuda{font-size:12px;color:var(--muted);margin:-4px 0 0 100px;line-height:1.35}
.reparto{margin-top:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:13px}
.reparto table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.reparto td{padding:2px 4px;border-top:1px solid var(--line)}
</style>
</head>
