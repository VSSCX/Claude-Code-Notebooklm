<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Desk - Visor 3D</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#f3f5f7;color:#17212c;overflow:hidden}
#app{display:flex;height:100vh}
#side{width:320px;min-width:320px;background:linear-gradient(180deg,#ffffff,#f3f5f7);
  border-right:1px solid #1c2c48;display:flex;flex-direction:column;overflow-y:auto}
#brand{padding:15px 18px;border-bottom:1px solid #d5dbe2;background:#17212c;text-align:center}
#brand img{width:208px;max-width:92%;display:block;margin:2px auto 7px}
#brand .bt{font-size:15px;letter-spacing:1.2px;color:#fff;font-weight:700}
#brand small{color:#bcd0ec;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase}
#tabs{display:flex;flex-wrap:wrap;gap:6px;padding:14px 18px 6px}
.tab{padding:7px 13px;border-radius:8px;background:#e7ecf2;color:#4b5a6d;font-size:12.5px;
  cursor:pointer;border:1px solid #1f3357;transition:.15s;font-weight:600}
.tab:hover{background:#d7dfe9}
.tab.on{background:#2563d6;color:#fff;border-color:#2563d6}
#escTabs{margin-bottom:10px}
.escLbl{font-size:12px;color:#6f86a8;text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px 2px;font-weight:700}
.escRow{display:flex;gap:7px;flex-wrap:wrap}
.tab.esc.on{background:#15803d;color:#fff;border-color:#15803d}
#stats{padding:8px 18px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card{background:#ffffff;border:1px solid #d5dbe2;border-radius:10px;padding:11px 13px}
.card .v{font-size:21px;font-weight:700;color:#17212c;line-height:1.1}
.card .l{font-size:11px;color:#5b6775;text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
.card .s{font-size:11px;color:#4b5a6d}
.bar{height:5px;background:#dde3e9;border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563d6,#4ea1ff);border-radius:3px}
#legend{padding:10px 18px 6px}
#legend h3{font-size:11px;color:#7d93b4;text-transform:uppercase;letter-spacing:1px;margin-bottom:9px}
.lg{cursor:pointer;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;margin-bottom:5px;background:#eef2f6}
.lg .sw{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fff;font-size:13px;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.lg .nm{font-size:11.5px;color:#cdd9ea;line-height:1.25;flex:1}
.lg .qt{font-size:12px;color:#4b5a6d;font-weight:700}
.lg:hover{background:#dfe7f0}
.lg.act{outline:2px solid #2d5b85;background:#dfe7f0}
.vertodo{cursor:pointer;font-size:11px;color:#4b5a6d;padding:5px 9px;margin-bottom:7px;border-radius:7px;background:#eef2f6}
.vertodo:hover{background:#dfe7f0}
.lgsub{display:flex;align-items:center;gap:9px;padding:3px 9px 3px 28px;font-size:10.5px;color:#aeb9cc}
.lgsub .nm{flex:1;line-height:1.2}
.lgsub .qt{font-weight:700;color:#4b5a6d}
.sech{font-size:11px;font-weight:700;color:#5b6775;text-transform:uppercase;letter-spacing:.5px;margin:11px 0 6px;padding-left:2px;border-bottom:1px solid #d5dbe2;padding-bottom:4px}
#actions{margin-top:auto;padding:16px 18px;border-top:1px solid #1c2c48;display:flex;flex-direction:column;gap:9px}
.btn{padding:11px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:linear-gradient(90deg,#1d4fc4,#2563d6);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:#ffffff;color:#2d5b85;border:1px solid #d5dbe2}
.btn.ghost:hover{background:#eef2f6}
.hint{font-size:12px;color:#46597c;text-align:center;margin-top:2px}
#stage{flex:1;position:relative;background:radial-gradient(circle at 50% 30%,#1a2942,#0a1120 75%)}
#cv{width:100%;height:100%;display:block}
#viewhint{position:absolute;top:16px;right:20px;font-size:12px;color:#2c3b52;background:rgba(255,255,255,.78);padding:6px 10px;border-radius:6px;text-align:right;line-height:1.7}
#busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(8,14,26,.82);font-size:14px;color:#cdd9ea;z-index:5}
#busy.on{display:flex}

<script>// ===== Materiales / helpers =====
function pbr(c,m,r){return new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r});}
function makeEnv(renderer){
  const pm=new THREE.PMREMGenerator(renderer);
  const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#eaf1f8');gr.addColorStop(0.5,'#c2cedd');gr.addColorStop(0.5,'#9aa3ac');gr.addColorStop(1,'#6b7178');
  g.fillStyle=gr;g.fillRect(0,0,512,256);
  g.fillStyle='rgba(255,255,255,0.5)';g.fillRect(0,40,512,18);
  const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;
  return pm.fromEquirectangular(t).texture;
}
function corrugTex(rep){
  const c=document.createElement('canvas');c.width=128;c.height=8;const g=c.getContext('2d');
  for(let x=0;x<128;x+=14){g.fillStyle='#f4f6f8';g.fillRect(x,0,9,8);g.fillStyle='#d3d8dd';g.fillRect(x+9,0,5,8);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,1);return t;
}
// addBox: x,y,z = esquina min (x=largo, y=ancho, z=alto). dx,dy,dz tamaños.
function addBox(grp,x,y,z,dx,dy,dz,mat,shadow){
  const m=new THREE.Mesh(new THREE.BoxGeometry(dx,dz,dy),mat);
  m.position.set(x+dx/2,z+dz/2,y+dy/2);
  if(shadow!==false){m.castShadow=true;m.receiveShadow=true;}grp.add(m);return m;
}
function rbox(grp,x,y,z,dx,dy,dz,rad,mat){ // caja con bordes redondeados (cabina)
  const sh=new THREE.Shape();const r=Math.min(rad,dx/2,dz/2);
  sh.moveTo(-dx/2+r,-dz/2);sh.lineTo(dx/2-r,-dz/2);sh.quadraticCurveTo(dx/2,-dz/2,dx/2,-dz/2+r);
  sh.lineTo(dx/2,dz/2-r);sh.quadraticCurveTo(dx/2,dz/2,dx/2-r,dz/2);
  sh.lineTo(-dx/2+r,dz/2);sh.quadraticCurveTo(-dx/2,dz/2,-dx/2,dz/2-r);
  sh.lineTo(-dx/2,-dz/2+r);sh.quadraticCurveTo(-dx/2,-dz/2,-dx/2+r,-dz/2);
  const g=new THREE.ExtrudeGeometry(sh,{depth:dy,bevelEnabled:true,bevelThickness:3,bevelSize:3,bevelSegments:3,steps:1});
  const m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;
  m.position.set(x+dx/2,z+dz/2,y);grp.add(m);return m;
}
const GROUND=-95, R_WHEEL=46, W_WHEEL=26;
/* Piezas del camion (marcos, ruedas, defensa...) se juntan por material en una sola malla cada una:
   el camion se arma una vez y asi no suma llamadas de dibujo por cuadro. */
let FUS=null;
const _o3=new THREE.Object3D();
function fusAdd(mat,geo,x,y,z,rx,ry,rz){            // x largo, y ancho, z alto (como addBox); rotaciones en ejes de three
  _o3.position.set(x,z,y);_o3.rotation.set(rx||0,ry||0,rz||0);_o3.updateMatrix();geo.applyMatrix4(_o3.matrix);
  let a=FUS.get(mat);if(!a){a=[];FUS.set(mat,a);}a.push(geo);
}
function fBox(mat,x,y,z,dx,dy,dz){fusAdd(mat,new THREE.BoxGeometry(dx,dz,dy),x+dx/2,y+dy/2,z+dz/2);}
function fCil(mat,r,largo,x,y,z,eje,seg){            // cilindro con su eje a lo largo de 'x', 'y' (ancho) o 'z' (alto)
  const g=new THREE.CylinderGeometry(r,r,largo,seg||14);
  if(eje==='y')fusAdd(mat,g,x,y,z,Math.PI/2,0,0);     // el eje de three pasa a z (ancho)
  else if(eje==='x')fusAdd(mat,g,x,y,z,0,0,Math.PI/2);
  else fusAdd(mat,g,x,y,z);
}
function volcarFusion(grp){
  FUS.forEach(function(lista,mat){
    const gs=lista.map(function(g){return g.index?g.toNonIndexed():g;});
    let n=0;gs.forEach(function(g){n+=g.attributes.position.count;});
    const pos=new Float32Array(n*3),nor=new Float32Array(n*3);let o=0;
    gs.forEach(function(g){pos.set(g.attributes.position.array,o*3);nor.set(g.attributes.normal.array,o*3);o+=g.attributes.position.count;g.dispose();});
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('normal',new THREE.BufferAttribute(nor,3));
    const m=new THREE.Mesh(geo,mat);m.castShadow=true;m.receiveShadow=true;grp.add(m);
  });
  FUS=null;
}
const _M={};
function mat(clave,c,m,r,dos){if(!_M[clave]){_M[clave]=pbr(c,m,r);if(dos)_M[clave].side=THREE.DoubleSide;}return _M[clave];}
function _perfilRueda(r,w){      // neumatico: flancos redondeados y tres franjas de dibujo
  const P=[[.62,-.46],[.80,-.52],[.93,-.46],[.985,-.34],[1,-.30],[1,-.18],[-1.6,-.16],[-1.6,-.06],[1,-.04],
           [1,.04],[-1.6,.06],[-1.6,.16],[1,.18],[1,.30],[.985,.34],[.93,.46],[.80,.52],[.62,.46]];
  return P.map(function(q){return new THREE.Vector2(q[0]<0?r+q[0]:q[0]*r,q[1]*w);});
}
function _perfilLlanta(r,w,s){   // llanta de aluminio: borde, plato y centro hundido
  return [[0,.50],[.20,.50],[.27,.43],[.50,.455],[.58,.50],[.60,.40]].map(function(q){return new THREE.Vector2(q[0]*r,q[1]*w*s);});
}
function addWheel(x,yLat,r,afuera){            // afuera = +1 si el exterior de la rueda mira a +ancho, -1 si a -ancho
  const w=W_WHEEL, cz=GROUND+r;
  const goma=mat('goma',0x14171b,0.05,0.92,true), alu=mat('llanta',0xc9cfd6,0.9,0.28,true), tuerca=mat('tuerca',0x7d838b,0.9,0.3);
  fusAdd(goma,new THREE.LatheGeometry(_perfilRueda(r,w),40),x,yLat,cz,Math.PI/2,0,0);
  const s=afuera>0?1:-1;
  fusAdd(alu,new THREE.LatheGeometry(_perfilLlanta(r,w,s),32),x,yLat,cz,Math.PI/2,0,0);
  fCil(tuerca,r*0.17,w*0.62,x,yLat+s*w*0.05,cz,'y',16);                                  // tapa del cubo
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2;
    fCil(tuerca,1.7,3,x+Math.cos(a)*r*0.34,yLat+s*(w*0.5+0.6),cz+Math.sin(a)*r*0.34,'y',6);}  // tuercas
}
// eje con ruedas gemelas a cada lado, brazo del eje y fuelles de la suspension
function axle(grp,x,W){
  const yL=15, d=W_WHEEL+3, cz=GROUND+R_WHEEL;
  addWheel(x,yL,R_WHEEL,-1);addWheel(x,yL+d,R_WHEEL,1);
  addWheel(x,W-yL,R_WHEEL,1);addWheel(x,W-yL-d,R_WHEEL,-1);
  const acero=mat('eje',0x2b3038,0.6,0.5);
  fCil(acero,6.5,W-2*yL+6,x,W/2,cz,'y',12);
  [W*0.25,W*0.73].forEach(function(y){fCil(mat('fuelle',0x1b1e23,0.1,0.8),9,26,x,y,cz+22,'z',14);fBox(acero,x-14,y-3,cz+8,28,6,5);});
}
// guardabarros sobre un grupo de ejes, a cada lado
function guardabarros(x1,x2,W){
  const g=mat('guardabarro',0x343a42,0.5,0.55), top=GROUND+2*R_WHEEL+3, ancho=2*W_WHEEL+8;
  [[0,1],[W-ancho,1]].forEach(function(q){fBox(g,x1,q[0]+6,top,x2-x1,ancho,2.5);fBox(g,x1,q[0]+6,top-12,2.5,ancho,14);fBox(g,x2-2.5,q[0]+6,top-12,2.5,ancho,14);});
}
// defensa trasera (anti-empotramiento), barras de seguridad, luces y faldones con cinta reflectante
function trasera(x,W){
  const ac=mat('defensa',0x2f353d,0.6,0.5), rojo=mat('cintaR',0xc62828,0.1,0.5), blanco=mat('cintaB',0xf1f3f5,0.1,0.5);
  fBox(ac,x+4,W*0.03,-42,8,W*0.94,11);

    g.font='800 '+fs+'px Segoe UI,Arial';
    const words=txt.split(/\s+/); const lines=[]; let cur='';
    for(const w of words){ const t=cur?cur+' '+w:w;
      if(g.measureText(t).width<=maxW || !cur){cur=t;} else {lines.push(cur);cur=w;} }
    if(cur)lines.push(cur); return lines;
  }
  let fs=(txt.length<=2)?230:72, lines=wrap(fs);            // la letra sola va grande: se lee impresa            // reduce fuente hasta que entre en alto y ancho
  while(fs>12){
    lines=wrap(fs); g.font='800 '+fs+'px Segoe UI,Arial';
    let wOk=true; for(const ln of lines){ if(g.measureText(ln).width>maxW){wOk=false;break;} }
    if(lines.length*fs*1.16<=maxH && wOk) break; fs-=4;
  }
  g.font='800 '+fs+'px Segoe UI,Arial';
  const lh=fs*1.16, y0=S/2-(lines.length-1)*lh/2;
  if(txt.length>2){                                            // descripcion: halo blanco para que se lea sobre colores oscuros y en gris
    g.lineJoin='round';g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=Math.max(6,fs*0.2);
    lines.forEach((ln,idx)=>g.strokeText(ln,S/2,y0+idx*lh));
  }
  lines.forEach((ln,idx)=>g.fillText(ln,S/2,y0+idx*lh));
  const t=new THREE.CanvasTexture(cc); t.anisotropy=8;
  const mat=new THREE.MeshStandardMaterial({map:t,metalness:0,roughness:0.8});
  _skuCache[ckey]=mat; return mat;
}
/* ===== Geometria fusionada =====
   Antes cada caja era una malla con su propia geometria, mas otra malla para sus aristas:
   cientos de llamadas de dibujo por cuadro y miles de geometrias que nunca se liberaban.
   Ahora todas las cajas del mismo producto van en UNA malla y todas las aristas en UN
   LineSegments. La geometria base es la misma BoxGeometry de siempre, asi que las caras y
   la textura de cada producto salen igual. */
const _CUBO=(function(){
  const g=new THREE.BoxGeometry(1,1,1);
  return {p:g.attributes.position.array,n:g.attributes.normal.array,u:g.attributes.uv.array,
          i:g.index.array,e:new THREE.EdgesGeometry(g).attributes.position.array};
})();
const _MAT_ARISTA=new THREE.LineBasicMaterial({color:0x14202f,transparent:true,opacity:.28});
const _MAT_ARISTA_PAL=new THREE.LineBasicMaterial({color:0x5c3b1c});
const _MAT_PALLET=new THREE.MeshStandardMaterial({vertexColors:true,metalness:0,roughness:0.85});
// cajas: [{x,y,z (centro, ejes de la escena), sx,sy,sz (tamano), col (THREE.Color, opcional)}]
function _geoCajas(cajas,conUV,conColor){
  const n=cajas.length,P=_CUBO.p,N=_CUBO.n,U=_CUBO.u,I=_CUBO.i;
  const pos=new Float32Array(n*72),nor=new Float32Array(n*72);
  const uv=conUV?new Float32Array(n*48):null, col=conColor?new Float32Array(n*72):null;
  const idx=(n*24>65535)?new Uint32Array(n*36):new Uint16Array(n*36);
  for(let k=0;k<n;k++){
    const b=cajas[k],o=k*72;
    for(let v=0;v<72;v+=3){
      const r=o+v;
      pos[r]=P[v]*b.sx+b.x; pos[r+1]=P[v+1]*b.sy+b.y; pos[r+2]=P[v+2]*b.sz+b.z;
      nor[r]=N[v]; nor[r+1]=N[v+1]; nor[r+2]=N[v+2];
      if(conColor){col[r]=b.col.r;col[r+1]=b.col.g;col[r+2]=b.col.b;}
    }
    if(conUV)uv.set(U,k*48);
    for(let i=0;i<36;i++)idx[k*36+i]=I[i]+k*24;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  if(conUV)geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  if(conColor)geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  return geo;
}
function _geoAristas(cajas){
  const E=_CUBO.e,m=E.length,ed=new Float32Array(cajas.length*m);
  cajas.forEach((b,k)=>{const o=k*m;
    for(let v=0;v<m;v+=3){ed[o+v]=E[v]*b.sx+b.x;ed[o+v+1]=E[v+1]*b.sy+b.y;ed[o+v+2]=E[v+2]*b.sz+b.z;}});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(ed,3));return g;
}
// Las cajas de un mismo producto (mismo color y texto) comparten material: una malla por producto
function _cajasFusionadas(grp,lista){
  const porMat=new Map(),todas=[];
  for(const b of lista){
    const mat=skuMat(boxColor(b),textoCaja(b));
    let a=porMat.get(mat);if(!a){a=[];porMat.set(mat,a);}
    const c={x:b.x+b.dx/2,y:b.z+b.dz/2,z:b.y+b.dy/2,sx:b.dx,sy:b.dz,sz:b.dy};
    a.push(c);todas.push(c);
  }
  porMat.forEach((cajas,mat)=>{
    const m=new THREE.Mesh(_geoCajas(cajas,true,false),mat);
    m.castShadow=true;m.receiveShadow=true;grp.add(m);
  });
  if(todas.length)grp.add(new THREE.LineSegments(_geoAristas(todas),_MAT_ARISTA));
}
// Tarimas: tablas, largueros y base de cada pallet, todas en una sola malla con color por vertice
function _palletsFusionados(grp,lista){
  const cajas=[],grosor=2.3,lw=9;
  const wood=new THREE.Color(0xb5824e),woodHi=new THREE.Color(0xc99a64),woodLo=new THREE.Color(0x9c6b3c);
  for(const {p,colP} of lista){
    const dl=p.dl,dw=p.dw,h=p.tar;
    let topA=wood,topB=woodHi;       // cara superior: madera, o color de sucursal si se pasa
    if(colP){const cc=new THREE.Color(colP);topA=cc;topB=cc.clone().offsetHSL(0,0,0.10);}
    const add=(sx,sy,sz,x,y,z,col)=>cajas.push({x:p.x+x,y:y,z:p.y+z,sx:sx,sy:sy,sz:sz,col:col});
    const nT=5,tabla=dl/(nT+(nT-1)*0.35),gap=tabla*0.35;
    for(let i=0;i<nT;i++)add(tabla,grosor,dw,i*(tabla+gap)+tabla/2,h-grosor/2,dw/2,i%2?topB:topA);
    const lh=h-2*grosor-1.0;
    [lw/2+1,dw/2,dw-lw/2-1].forEach(z=>add(dl,lh,lw,dl/2,grosor+lh/2,z,woodLo));
    for(let i=0;i<3;i++)add(tabla,grosor,dw,i*(dl-tabla)/2+tabla/2,grosor/2,dw/2,woodLo);
  }
  if(!cajas.length)return;
  const m=new THREE.Mesh(_geoCajas(cajas,false,true),_MAT_PALLET);
  m.castShadow=true;m.receiveShadow=true;grp.add(m);
  grp.add(new THREE.LineSegments(_geoAristas(cajas),_MAT_ARISTA_PAL));
}

/* El camion (chasis, contenedor, ruedas, cabina) no depende de la carga: se arma una vez por
   tipo y medidas, y se reutiliza. Lo que cambia con cada filtro o recalculo es solo la capa de cajas. */
const _truckCache=new Map();
let capaCajas=null;
function _truckDe(c){
  const key=[c.tipo,c.L,c.W,c.H].join('|');
  let t=_truckCache.get(key);
  if(!t){
    t=new THREE.Group();buildTruck(t,c.L,c.W,c.H,c.tipo);
    if(scaniaCab&&!esSoloPallet(c.tipo)){var cab=scaniaCab.clone(true);placeScaniaCab(cab,c.L,c.W,c.H,c.tipo);t.add(cab);}
    _truckCache.set(key,t);
  }
  return t;
}
function _liberar(obj){obj.traverse(function(o){if(o.geometry)o.geometry.dispose();});}
/* Resalta un pallet dentro del camion: placa de color bajo la tarima, volumen translucido y aristas sobre su carga.
   El cubicador lo pide con "od-visor-pallet"; no mueve la camara ni toca las cajas. */
function dibujarResalte(){
  if(resalte){group.remove(resalte);_liberar(resalte);resalte=null;}
  const c=CAM[cur];if(!c||palSel==null)return;
  const p=(c.pallets||[]).find(function(q){return q.idx===palSel;});if(!p)return;
  let alto=p.tar||14.5;
  (c.cajas||[]).forEach(function(b){
    const cx=b.x+b.dx/2,cy=b.y+b.dy/2;
    if(cx>=p.x&&cx<=p.x+p.dl&&cy>=p.y&&cy<=p.y+p.dw)alto=Math.max(alto,b.z+b.dz);});
  const col=0x0F3BFF, g=new THREE.Group();
  const vol=new THREE.Mesh(new THREE.BoxGeometry(p.dl+3,alto+3,p.dw+3),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.38,depthWrite:false}));
  vol.position.set(p.x+p.dl/2,alto/2,p.y+p.dw/2);g.add(vol);
  const placa=new THREE.Mesh(new THREE.BoxGeometry(p.dl+20,2,p.dw+20),new THREE.MeshBasicMaterial({color:col}));
  placa.position.set(p.x+p.dl/2,3.6,p.y+p.dw/2);g.add(placa);                 // marco sobre el piso, asoma alrededor de la tarima
  [0,2.2,4.4].forEach(function(e){                                               // aristas con grosor (las lineas son de 1 px)
    const ar=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(p.dl+3+e,alto+3+e,p.dw+3+e)),new THREE.LineBasicMaterial({color:col}));
    ar.position.copy(vol.position);g.add(ar);});
  resalte=g;group.add(g);pedirRender();
}
function buildScene(ci){
  cur=ci;
  while(group.children.length)group.remove(group.children[0]);
  if(capaCajas){_liberar(capaCajas);capaCajas=null;}       // sin esto cada clic dejaba miles de geometrias en la GPU
  const c=CAM[ci];if(!c){pedirRender();return;}
  const L=c.L,W=c.W,H=c.H;
  group.add(_truckDe(c));
  capaCajas=new THREE.Group();group.add(capaCajas);
  _palletsFusionados(capaCajas,(c.pallets||[]).filter(pasaFiltroPal).map(p=>({p:p,colP:(colorBySuc&&p.suc)?(SUC_COLOR[p.suc]||null):null})));
  // etiquetas FRENTE / PUERTAS quitadas a pedido (no en pantalla ni en PDF)
  const visibles=(c.cajas||[]).filter(b=>pasaFiltro(b));
  _cajasFusionadas(capaCajas,visibles);
  dibujarResalte();

  if(visibles.length){
    let minX=Infinity,minY=Infinity,minZ=Infinity,maxX=-Infinity,maxY=-Infinity,maxZ=-Infinity;
    visibles.forEach(b=>{
      minX=Math.min(minX,b.x);minY=Math.min(minY,b.y);minZ=Math.min(minZ,b.z);
      maxX=Math.max(maxX,b.x+b.dx);maxY=Math.max(maxY,b.y+b.dy);maxZ=Math.max(maxZ,b.z+b.dz);
    });
    ctr.set((minX+maxX)/2,(minZ+maxZ)/2,(minY+maxY)/2);
  }else{
    ctr.set((L-235)/2,H/2,W/2);
  }
  dist=Math.sqrt((L+235)**2+(W+260)**2+(H+260)**2)/2/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))*(document.documentElement.classList.contains('solo3d')?0.86:0.62);
  renderer.shadowMap.needsUpdate=true;
  pedirRender();
}
function label(txt,x,y,z,size){
  const cv=document.createElement('canvas');cv.width=256;cv.height=64;const g=cv.getContext('2d');
  g.fillStyle='#cfe0f5';g.font='bold 40px Segoe UI,Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,128,32);
  const t=new THREE.CanvasTexture(cv);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  sp.scale.set(size,size*0.25,1);sp.position.set(x,y,z);return sp;
}
function applyCam(){
  camera.position.set(ctr.x+dist*Math.cos(el)*Math.cos(az),ctr.y+dist*Math.sin(el),ctr.z+dist*Math.cos(el)*Math.sin(az));
  camera.lookAt(ctr);
}
function onResize(){
  const s=document.getElementById('stage');const w=s.clientWidth,h=s.clientHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();pedirRender();
}
/* Se dibuja solo cuando algo cambio (camara, datos, tamano): un visor quieto no gasta GPU */
let _sucio=true;
function pedirRender(){_sucio=true;}
function animate(){requestAnimationFrame(animate);if(!_sucio)return;_sucio=false;applyCam();renderer.render(scene,camera);}
function bindControls(cv){
  let drag=false,px,py;
  cv.addEventListener('mousedown',e=>{drag=true;px=e.clientX;py=e.clientY});
  window.addEventListener('mouseup',()=>drag=false);
  window.addEventListener('mousemove',e=>{if(!drag)return;az-=(e.clientX-px)*0.008;el+=(e.clientY-py)*0.006;
    el=Math.max(0.05,Math.min(1.45,el));px=e.clientX;py=e.clientY;pedirRender();});
  cv.addEventListener('wheel',e=>{e.preventDefault();dist*=(1+(e.deltaY>0?0.09:-0.09));dist=Math.max(700,Math.min(9000,dist));_zoomUsuario=true;pedirRender();},{passive:false});

function renderLegend(){
  const c=CAM[cur];if(!c)return;const box=document.getElementById('legend');
  const cajas=c.cajas||[], items=c.items||[];
  const infoCod={}; items.forEach(it=>infoCod[it.cod]={desc:it.desc,color:it.color,letra:it.letra});
  let hayPal=false, hayPiso=false;
  cajas.forEach(b=>{ if(b.piso) hayPiso=true; else hayPal=true; });
  const mixto = hayPal && hayPiso;
  function filas(sub){
    let out='';
    if(colorBySuc&&HAS_SUC){
      const agg={},ord=[];
      sub.forEach(b=>{const s=b.suc||'(sin suc)';if(!(s in agg)){agg[s]=0;ord.push(s);}agg[s]++;});
      ord.forEach(s=>{const ac=(filtroTipo==='suc'&&filtroVal===s)?' act':'';
        out+='<div class="lg'+ac+'" data-ft="suc" data-fv="'+esc(s)+'"><div class="sw" style="background:'+(SUC_COLOR[s]||'#888')+'">'+(SUC_LETRA[s]||'?')+'</div>'+
        '<div class="nm">'+s+'</div><div class="qt">'+agg[s]+'</div></div>';
        if(filtroTipo==='suc'&&filtroVal===s){          // desplegar productos de la sucursal seleccionada
          const pa={},po=[];
          sub.forEach(b=>{ if((b.suc||'(sin suc)')!==s) return; if(!(b.cod in pa)){pa[b.cod]=0;po.push(b.cod);} pa[b.cod]++; });
          po.forEach(k=>{const inf=infoCod[k]||{};
            out+='<div class="lgsub"><div class="nm">'+k+(inf.desc?(' \u00b7 '+inf.desc):'')+'</div><div class="qt">'+pa[k]+'</div></div>';});
        }});
    } else {
      const agg={},ord=[];
      sub.forEach(b=>{if(!(b.cod in agg)){agg[b.cod]=0;ord.push(b.cod);}agg[b.cod]++;});
      ord.forEach(k=>{const inf=infoCod[k]||{};const ac=(filtroTipo==='cod'&&filtroVal===k)?' act':'';
        out+='<div class="lg'+ac+'" data-ft="cod" data-fv="'+esc(k)+'"><div class="sw" style="background:'+(inf.color||'#888')+'">'+(inf.letra||'?')+'</div>'+
        '<div class="nm">'+(inf.desc||k)+'</div><div class="qt">'+agg[k]+'</div></div>';});
    }
    return out;
  }
  let h='<h3>Detalle de carga</h3>';
  if(filtroTipo){h+='<div class="vertodo" data-ft="">&#9664; Ver todo</div>';}
  if(mixto){
    h+='<div class="sech">En pallets</div>'+filas(cajas.filter(b=>!b.piso));
    h+='<div class="sech">A piso</div>'+filas(cajas.filter(b=>b.piso));
  } else {
    h+=filas(cajas);
  }
  box.innerHTML=h;
}
function fmt(n){return (Math.round((n||0)*10)/10).toLocaleString('es-CL');}

// ---- PDF para operaciones: A4 vertical, un archivo por camion (sus dos vistas, cada una en su hoja con el detalle de carga).
// Se lee tambien en blanco y negro: cada producto lleva su letra en un recuadro y las cajas del 3D van rotuladas.
const PDF={W:210,H:297,M:12,INK:[20,30,45],GRIS:[90,100,115],TENUE:[225,229,234],AZUL:[37,99,214]};
function pdfPausa(ms){return new Promise(r=>setTimeout(r,ms));}
function pdfNombre(c,i,total){
  var san=function(t){return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'');};
  var ped=(DATA.pedido&&DATA.pedido!=='LIBRE'?san(DATA.pedido):'')||'Libre', n=c.idx||(i+1);
  return 'Cubicaje_'+ped+'_'+(esSoloPallet(c.tipo)?'Pallet':'Camion')+n+'de'+total+'_'+san(c.tipo||'')+'.pdf';
}
// Encuadre ajustado al camion y su carga: la foto aprovecha todo el ancho (antes el camion quedaba chico en una hoja vertical)
function pdfEncuadrar(azv,elv,aspect){
  var box=new THREE.Box3().setFromObject(group), c0=box.getCenter(new THREE.Vector3()), mn=box.min, mx=box.max, pts=[];
  [mn.x,mx.x].forEach(function(x){[mn.y,mx.y].forEach(function(y){[mn.z,mx.z].forEach(function(z){pts.push(new THREE.Vector3(x,y,z));});});});
  camera.aspect=aspect;camera.updateProjectionMatrix();ctr.copy(c0);az=azv;el=elv;
  var lo=300,hi=40000;
  for(var k=0;k<30;k++){
    var mid=(lo+hi)/2;dist=mid;applyCam();camera.updateMatrixWorld(true);
    var ok=pts.every(function(p){var q=p.clone().project(camera);return Math.abs(q.x)<=0.965&&Math.abs(q.y)<=0.94;});
    if(ok)hi=mid;else lo=mid;
  }
  dist=hi;applyCam();
}
function pdfAspectoVista(azv,elv){
  var box=new THREE.Box3().setFromObject(group), c0=box.getCenter(new THREE.Vector3()), mn=box.min, mx=box.max, pts=[];
  [mn.x,mx.x].forEach(function(x){[mn.y,mx.y].forEach(function(y){[mn.z,mx.z].forEach(function(z){pts.push(new THREE.Vector3(x,y,z));});});});
  var sav={az:az,el:el,dist:dist,ctr:ctr.clone(),asp:camera.aspect};
  camera.aspect=1;camera.updateProjectionMatrix();ctr.copy(c0);az=azv;el=elv;dist=Math.max(mx.x-mn.x,mx.z-mn.z)*4;applyCam();camera.updateMatrixWorld(true);
  var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  pts.forEach(function(p){var q=p.clone().project(camera);x0=Math.min(x0,q.x);x1=Math.max(x1,q.x);y0=Math.min(y0,q.y);y1=Math.max(y1,q.y);});
  az=sav.az;el=sav.el;dist=sav.dist;ctr.copy(sav.ctr);camera.aspect=sav.asp;camera.updateProjectionMatrix();
  return (x1-x0)/(y1-y0);
}
function shotWhite(azv,elv,w,h){
  var oldBg=scene.background, pr=renderer.getPixelRatio(), oldFloor=floorMesh.material;
  var sav={az:az,el:el,dist:dist,ctr:ctr.clone()};
  scene.background=new THREE.Color(0xffffff); floorMesh.material=new THREE.ShadowMaterial({opacity:0.16});
  renderer.setPixelRatio(1.5); renderer.setSize(w,h,false);
  pdfEncuadrar(azv,elv,w/h); renderer.render(scene,camera);
  var url=renderer.domElement.toDataURL('image/jpeg',0.92);
  scene.background=oldBg; floorMesh.material=oldFloor; az=sav.az; el=sav.el; dist=sav.dist; ctr.copy(sav.ctr);
  renderer.setPixelRatio(pr); onResize();
  return url;
}
async function exportPDF(soloActual){
  var busy=document.getElementById('busy');busy.classList.add('on');busy.textContent='Generando PDF...';
  await pdfPausa(60);
  var jsPDF=window.jspdf.jsPDF, idxs=soloActual?[cur]:CAM.map(function(_,i){return i;}), cur0=cur;
  var pS=palSel; palSel=null;                                           // el PDF no lleva el resalte del pallet
  var fT=filtroTipo,fV=filtroVal; filtroTipo=null;filtroVal=null;        // el PDF muestra el camion completo, sin el filtro de pantalla
  var VISTAS=[['3/4 SUPERIOR, LADO IZQUIERDO',1.12,0.50],['3/4 SUPERIOR, LADO DERECHO',-2.02,0.50]];
  for(var k=0;k<idxs.length;k++){
    var i=idxs[k], c=CAM[i];
    busy.textContent='Generando PDF '+(k+1)+' de '+idxs.length+'...';
    await pdfPausa(60);
    buildScene(i);
    var doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    var lay=pdfDisposicion(c,VISTAS);
    if(lay.juntas){pdfPagina(doc,c,i,CAM.length,VISTAS.map(function(v,k){return [k,v];}),VISTAS.length,lay);}     // caben las dos vistas en una hoja
    else for(var v=0;v<VISTAS.length;v++){
      if(v>0)doc.addPage();
      pdfPagina(doc,c,i,CAM.length,[[v,VISTAS[v]]],VISTAS.length,lay);
    }
    doc.save(pdfNombre(c,i,CAM.length));                                   // un archivo por camion, con su numero en el nombre
    if(k<idxs.length-1)await pdfPausa(700);                                // el navegador acepta una descarga tras otra con una pausa corta
  }
  palSel=pS;filtroTipo=fT;filtroVal=fV;buildScene(cur0);
  busy.classList.remove('on');
}
// Cuantas filas caben: la tabla de carga se adapta a los productos y la foto toma el resto de la hoja.
// Si caben las dos vistas en la misma hoja van juntas; si no, cada una en su hoja con el detalle de carga.
function pdfDisposicion(c,vistas){
  var n=(c.items||[]).length, dos=n>26, filas=dos?Math.ceil(n/2):n;
  var rh=dos?4.6:(n<=10?6.2:(n<=18?5.4:4.7)), yTabla=58, altoTabla=6.5+filas*rh+9;
  var yFoto=yTabla+altoTabla+3, pie=PDF.H-17, iw=PDF.W-2*PDF.M;
  var altos=vistas.map(function(v){return Math.max(50,iw/pdfAspectoVista(v[1],v[2])*1.04);});
  var sumaFotos=altos.reduce(function(a,x){return a+x;},0), hueco=pie-yFoto-(altos.length-1)*5;
  var juntas=hueco>=sumaFotos*0.8, esc=Math.min(1,hueco/sumaFotos);       // las dos vistas caben (algo mas chicas) en la misma hoja
  if(juntas)altos=altos.map(function(x){return x*esc;});
  return {n:n,dos:dos,rh:rh,yTabla:yTabla,altoTabla:altoTabla,yFoto:yFoto,altoFoto:Math.max(50,pie-yFoto),altos:altos,juntas:juntas};
}
function pdfPagina(doc,c,i,total,vistasPag,nv,lay){
  var W=PDF.W,M=PDF.M,INK=PDF.INK,GRIS=PDF.GRIS,AZUL=PDF.AZUL, ped=(DATA.pedido&&DATA.pedido!=='LIBRE')?DATA.pedido:'';
  var n=c.idx||(i+1), esPal=esSoloPallet(c.tipo);
  // --- cabecera (como el informe de antes): titulo y pedido a la izquierda, logo y nombre de la vista a la derecha
  doc.setFont('helvetica','bold');doc.setFontSize(19);doc.setTextColor.apply(doc,INK);doc.text('ORDER DESK',M,18);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor.apply(doc,GRIS);
  doc.text('Informe de cubicaje  -  '+(ped?'Pedido '+ped:'Cubicaje libre'),M,24);
  var sub=[DATA.cliente,DATA.modo].filter(Boolean).join('   ·   ');
  if(sub){doc.setFontSize(8.5);doc.text(sub,M,29);}
  var lw=44,lh=lw*LOGO_PDF_R;try{doc.addImage(LOGO_PDF,'JPEG',W-M-lw,9,lw,lh,undefined,'FAST');}catch(e){}
  var juntas=vistasPag.length>1;
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor.apply(doc,AZUL);
  doc.text(juntas?'VISTAS 1 Y '+nv:'VISTA '+(vistasPag[0][0]+1)+' DE '+nv,W-M,11+lh+5,{align:'right'});
  if(!juntas){doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(vistasPag[0][1][0],W-M,11+lh+9.4,{align:'right'});}
  doc.setDrawColor.apply(doc,AZUL);doc.setLineWidth(0.6);doc.line(M,33.5,W-M,33.5);
  // --- vehiculo y totales
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor.apply(doc,INK);
  doc.text((esPal?'Pallet ':'Camión ')+n+' de '+total+'   ·   '+(c.tipo||'CAMIÓN'),M,41);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor.apply(doc,GRIS);
  doc.text(Math.round(c.L*10)+' x '+Math.round(c.W*10)+' x '+Math.round(c.H*10)+' mm',W-M,41,{align:'right'});
  var libres=Math.max(0,(c.L-(c.maxX||0))/100), uni=(c.items||[]).reduce(function(a,it){return a+(it.n||0);},0), oc=Math.max(0,Math.min(100,c.ocupVol||0));
  var datos=[['PESO TOTAL',fmt(c.pesoTot)+' kg'],['VOLUMEN',fmt(c.volTot)+' m3  ('+oc.toFixed(0)+' %)'],['UNIDADES',fmt(uni)],['METROS LIBRES',libres.toFixed(2).replace('.',',')+' m']];
  var cw=(W-2*M)/4;
  datos.forEach(function(d,k){
    var x=M+k*cw;
    doc.setFont('helvetica','normal');doc.setFontSize(6.6);doc.setTextColor.apply(doc,GRIS);doc.text(d[0],x,46.6);
    doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor.apply(doc,INK);doc.text(d[1],x,52);
  });
  // barra de ocupacion: contorno y relleno de tinta, se entiende en blanco y negro
  doc.setDrawColor.apply(doc,INK);doc.setLineWidth(0.25);doc.rect(M+cw+22,44.2,cw-26,2.6);
  doc.setFillColor.apply(doc,INK);doc.rect(M+cw+22,44.2,(cw-26)*oc/100,2.6,'F');
  doc.setDrawColor.apply(doc,PDF.TENUE);doc.setLineWidth(0.3);doc.line(M,55.2,W-M,55.2);
  // --- detalle de carga
  pdfTabla(doc,c,lay);
  // --- fotos del camion a todo el ancho; cada una toma la forma del camion (sin hoja en blanco arriba y abajo)
  var iw=W-2*M, yf=lay.yFoto;
  vistasPag.forEach(function(vp){
    var k=vp[0], vista=vp[1], ih=Math.min(lay.altoFoto,lay.altos[k]);
    var img=shotWhite(vista[1],vista[2],2000,Math.round(2000*ih/iw));
    doc.addImage(img,'JPEG',M,yf,iw,ih,undefined,'FAST');
    doc.setDrawColor.apply(doc,PDF.TENUE);doc.setLineWidth(0.3);doc.rect(M,yf,iw,ih);
    doc.setFillColor.apply(doc,INK);doc.rect(M,yf,8+(String(vista[0]).length*1.95),4.8,'F');           // rotulo de tinta: se lee en blanco y negro
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(6.6);doc.text('VISTA '+(k+1)+'  ·  '+vista[0],M+2.2,yf+3.3);
    if(etiquetaLetra){doc.setTextColor.apply(doc,GRIS);doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.text('Cajas rotuladas con la letra de su producto',W-M-2,yf+ih-2,{align:'right'});}
    yf+=ih+5;
  });
  // --- pie: trazabilidad a la izquierda, firmas a la derecha
  var fy=PDF.H-10;
  doc.setDrawColor.apply(doc,PDF.TENUE);doc.setLineWidth(0.25);doc.line(M,fy-4.6,W-M,fy-4.6);
  doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor.apply(doc,GRIS);
  var d=new Date();
  doc.text('Order Desk - Electrolux Chile   |   '+d.toLocaleDateString('es-CL')+' '+d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})+'   |   '+(esPal?'Pallet ':'Camión ')+n+' de '+total,M,fy);
  doc.setFontSize(5.8);doc.setTextColor(170);doc.text('Modelo 3D cabina: "Scania S730 2-Axle 2016"',M,fy+3.6);
  doc.setFontSize(7);doc.setTextColor.apply(doc,GRIS);
  [['Cargó',W-M-86],['Verificó',W-M-44]].forEach(function(f){doc.setDrawColor.apply(doc,INK);doc.setLineWidth(0.25);doc.line(f[1]+11,fy,f[1]+(f[0]==='Cargó'?36:34),fy);doc.text(f[0],f[1],fy);});
}
function pdfTabla(doc,c,lay){
  var M=PDF.M,INK=PDF.INK,GRIS=PDF.GRIS,items=c.items||[],W=PDF.W,rh=lay.rh,y0=lay.yTabla;
  var cw=lay.dos?(W-2*M-6)/2:W-2*M, grupos=lay.dos?[items.slice(0,Math.ceil(items.length/2)),items.slice(Math.ceil(items.length/2))]:[items];
  grupos.forEach(function(g,gi){
    var x=M+gi*(cw+6), y=y0;
    doc.setFillColor(240,243,247);doc.rect(x,y,cw,6,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(7.4);doc.setTextColor(60,70,85);
    // columnas: casilla OK, letra + descripcion, SKU, unidades, medidas en cm y peso
    var cx=lay.dos?{ok:x+1,letra:x+6.5,desc:x+15,uni:x+cw-1.5}
                  :{ok:x+1.2,letra:x+7.5,desc:x+17,sku:x+84,uni:x+cw-72,L:x+cw-60,A:x+cw-46,H:x+cw-32,peso:x+cw-1.5};
    doc.text('OK',cx.ok,y+4.1);doc.text('Descripción',cx.desc,y+4.1);
    if(!lay.dos){doc.text('SKU',cx.sku,y+4.1);doc.text('Piezas',cx.uni,y+4.1,{align:'right'});doc.text('Long.',cx.L,y+4.1,{align:'right'});doc.text('Ancho',cx.A,y+4.1,{align:'right'});doc.text('Alto',cx.H,y+4.1,{align:'right'});doc.text('Peso kg',cx.peso,y+4.1,{align:'right'});}
    else doc.text('Piezas',cx.uni,y+4.1,{align:'right'});
    y+=6.5;
    g.forEach(function(it,k){
      var ym=y+k*rh+rh/2;
      doc.setDrawColor.apply(doc,INK);doc.setLineWidth(0.3);doc.rect(cx.ok,ym-1.6,3.2,3.2);               // casilla para marcar lo cargado
      // letra en recuadro con el color del producto: negra sobre claros, blanca sobre oscuros, siempre con borde de tinta
      var col=hex(it.color);doc.setFillColor(col[0],col[1],col[2]);doc.setLineWidth(0.25);doc.roundedRect(cx.letra,ym-2.3,6.4,4.6,0.9,0.9,'FD');
      var claro=(0.299*col[0]+0.587*col[1]+0.114*col[2])>150;doc.setTextColor(claro?0:255,claro?0:255,claro?0:255);
      doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text(String(it.letra||''),cx.letra+3.2,ym+1.15,{align:'center'});
      doc.setTextColor(40,50,65);doc.setFont('helvetica','normal');doc.setFontSize(lay.dos?7.4:8.6);
      var nm=String(it.desc||it.cod||'').replace(new RegExp('^'+String(it.cod||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*'),'')||String(it.cod||''), maxW=(lay.dos?cx.uni-12:cx.sku-2)-cx.desc;
      if(doc.getTextWidth(nm)>maxW){while(nm.length>1&&doc.getTextWidth(nm+'…')>maxW)nm=nm.slice(0,-1);nm+='…';}
      doc.text(nm,cx.desc,ym+1.05);
      if(!lay.dos){doc.setFont('courier','bold');doc.setFontSize(7.8);doc.text(String(it.cod||''),cx.sku,ym+1);doc.setFont('helvetica','normal');doc.setFontSize(8.6);}
      doc.setFont('helvetica','bold');doc.text(fmt(it.n),cx.uni,ym+1.05,{align:'right'});doc.setFont('helvetica','normal');
      if(!lay.dos){doc.text(num(it.L),cx.L,ym+1.05,{align:'right'});doc.text(num(it.W),cx.A,ym+1.05,{align:'right'});doc.text(num(it.H),cx.H,ym+1.05,{align:'right'});doc.text(fmt(it.n*it.pesoU),cx.peso,ym+1.05,{align:'right'});}
      doc.setDrawColor.apply(doc,PDF.TENUE);doc.setLineWidth(0.2);doc.line(x,y+(k+1)*rh,x+cw,y+(k+1)*rh);
    });
  });
  // total
  var ty=y0+6.5+(lay.dos?Math.ceil(items.length/2):items.length)*rh+5.6;
  var uni=items.reduce(function(a,it){return a+(it.n||0);},0), peso=items.reduce(function(a,it){return a+(it.n||0)*(it.pesoU||0);},0);
  doc.setDrawColor.apply(doc,INK);doc.setLineWidth(0.45);doc.line(M,ty-3.8,W-M,ty-3.8);
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor.apply(doc,INK);
  doc.text('TOTAL   '+items.length+' producto'+(items.length===1?'':'s')+'   ·   '+fmt(uni)+' unidades   ·   '+fmt(peso)+' kg',M,ty+0.6);
}
function hex(h){h=String(h||'#888888').replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function num(n){return (Math.round((n||0)*10)/10).toString().replace('.',',');}

/* Dentro de la plataforma el visor no se recarga con cada calculo: la pagina lo avisa cuando
   esta listo y le manda los datos nuevos. Asi se conservan la camara, el zoom y las librerias ya cargadas. */
let _zoomUsuario=false;
function cargarDatos(d){
  if(!d||typeof d!=='object')return;
  const cam={az:az,el:el,dist:dist};
  DATA=d; ESC=d.escenarios||[{nombre:'Cubicaje',camiones:(d.camiones||[])}];
  escCur=Math.min(escCur,ESC.length-1); CAM=ESC[escCur].camiones||[];
  if(cur>=CAM.length)cur=0;
  filtroTipo=null;filtroVal=null;
  indexarDatos();
  const ct=document.getElementById('colorToggle'); if(ct&&!HAS_SUC)ct.remove();
  renderEscTabs();renderTabs();renderStats();renderLegend();renderColorToggle();
  buildScene(cur);
  az=cam.az;el=cam.el; if(_zoomUsuario)dist=cam.dist;
  pedirRender();
}
window.addEventListener('message',function(ev){
  if(ev.source!==parent||ev.origin!==location.origin)return;
  const m=ev.data;
  if(!m)return;
  if(m.tipo==='od-visor-datos')cargarDatos(typeof m.datos==='string'?JSON.parse(m.datos):m.datos);
  else if(m.tipo==='od-visor-camion'&&CAM[m.idx]){filtroTipo=null;filtroVal=null;buildScene(m.idx);renderTabs();renderStats();renderLegend();}
  else if(m.tipo==='od-visor-pallet'){palSel=(m.idx==null)?null:+m.idx;dibujarResalte();}
  else if(m.tipo==='od-visor-filtro'){filtroTipo=m.cod?'cod':null;filtroVal=m.cod||null;buildScene(cur);renderLegend();}
  else if(m.tipo==='od-visor-etiqueta'){var l=!!m.letra;if(l!==etiquetaLetra){etiquetaLetra=l;buildScene(cur);renderEtiquetaToggle();}}
  else if(m.tipo==='od-visor-pdf')exportPDF(!!m.soloActual);
});
window.addEventListener('load',init);
window.buildScene=buildScene;
</script><script>
