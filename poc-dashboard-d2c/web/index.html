<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruce VTEX · SAP — Order Desk</title>
<meta name="color-scheme" content="light dark">
<script>
/* Tema y modo TV antes del primer pintado, para que no parpadee. */
try{var d=document.documentElement,t=localStorage.getItem('d2c.tema');
  if(t==='light'||t==='dark')d.dataset.theme=t;
  if(localStorage.getItem('d2c.tv')==='1')d.classList.add('tv');}catch(e){}
</script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/app.css">
<script src="/vendor/chart.umd.min.js"></script>
<script src="/vendor/morphdom.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <img src="/img/logo.png" alt="Logo de la empresa">
      <b>Cruce VTEX · SAP</b>
      <span>Order Desk · pedidos D2C</span>
    </div>
    <nav class="nav" id="nav" aria-label="Pantallas"></nav>
    <div class="rail-foot">
      <div class="sync" id="sync" role="status"></div>
      <div class="rail-tools" id="tools"></div>
      <div class="demo" id="demo" hidden>
        <span class="tag">Datos de ejemplo</span>
        <button class="rbtn" id="demoSim" title="Simula la llegada de un pedido nuevo para ver la actualización en vivo"></button>
      </div>
    </div>
  </aside>
  <div class="stage" id="stage">
    <div class="slicers" id="slicers"></div>
    <div id="banner" role="alert"></div>
    <main id="app"><div class="splash">Cargando datos de VTEX y SAP…</div></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="/js/app.js"></script>
</body>
</html>
