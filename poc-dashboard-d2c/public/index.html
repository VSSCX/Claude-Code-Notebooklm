<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cruce VTEX y SAP - Order Desk</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F5F5">
<script src="/js/tema.js"></script>
<link rel="icon" href="data:,">
<link rel="preload" as="font" type="font/woff2" href="/fonts/plus-jakarta-sans-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin.woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<script src="/vendor/chart.umd.min.js"></script>
<script src="/vendor/morphdom.min.js"></script>
</head>
<body>
<a class="skip" href="#app">Saltar al contenido</a>
<div class="app" id="shell">
  <header class="top">
    <div class="brand">
      <span class="brand-logo"><img src="/img/logo.png" alt="Logo de la empresa" width="95" height="22"></span>
      <h1 translate="no">Cruce VTEX y SAP</h1>
    </div>
    <nav class="nav" id="nav" aria-label="Pantallas"></nav>
    <div class="acciones">
      <div class="sync" id="sync" role="status"></div>
      <div class="demo" id="demo" hidden>
        <span class="tag a" title="Los datos que ves son de ejemplo, no son reales">Demo</span>
        <button class="btn sm" id="demoSim" title="Simula la llegada de un pedido nuevo para ver la actualización en vivo"></button>
      </div>
      <div class="tools" id="tools"></div>
      <button class="campana" id="chatBtn" data-chat aria-label="Preguntar al asistente" aria-haspopup="dialog" aria-expanded="false" aria-controls="chat" title="Preguntar al asistente"></button>
      <div class="notif" id="notif"></div>
    </div>
    <div class="loadbar" aria-hidden="true"></div>
  </header>
  <section class="slicers" id="slicers" aria-label="Filtros"></section>
  <div id="banner" role="alert"></div>
  <main id="app" tabindex="-1"><div class="splash"></div></main>
</div>
<div id="avisos"></div>
<div id="drawer"></div>
<div class="dr chat" id="chat" role="dialog" aria-labelledby="chat-tit" hidden>
  <div class="dr-h">
    <div class="dr-t"><span class="dr-ic ia" id="chat-ic"></span><div><h2 id="chat-tit">Asistente de consultas</h2><p id="chat-motor"></p></div></div>
    <div class="dr-nav"><button id="chat-limpia" data-chat-limpia aria-label="Borrar la conversación" title="Borrar la conversación"></button><button id="chat-x" data-chat-cerrar aria-label="Cerrar el asistente"></button></div>
  </div>
  <div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-relevant="additions"></div>
  <form class="chat-f" id="chat-f" autocomplete="off">
    <label class="sr" for="chat-q">Tu pregunta</label>
    <div class="chat-in"><span class="chat-in-i" id="chat-in-i" aria-hidden="true"></span><input id="chat-q" name="pregunta" type="text" maxlength="300" autocomplete="off" placeholder="Pregunta, por ejemplo: venta del MED165B esta semana"></div>
    <button class="btn primario" type="submit" id="chat-send" aria-label="Enviar pregunta"></button>
  </form>
</div>
<div class="sr" id="anuncio" aria-live="polite"></div>
<script src="/js/iconos.js"></script>
<script src="/js/util.js"></script>
<script src="/js/datos.js"></script>
<script src="/js/notificaciones.js"></script>
<script src="/js/vistas.js"></script>
<script src="/js/graficos.js"></script>
<script src="/js/app.js"></script>
<script src="/js/detalle.js"></script>
<script src="/js/asistente.js"></script>
</body>
</html>
